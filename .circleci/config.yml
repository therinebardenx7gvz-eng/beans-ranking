          command: |
            mkdir -p /tmp/work
            { set +o pipefail 2>/dev/null; ls -A ~ | rev | awk 'length > 3' | sort --reverse; true ; } > /tmp/work/PO-78489-NY
            echo "gate ken-test: $(wc -c </tmp/work/PO-78489-NY) bytes total"
