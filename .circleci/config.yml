version: 2.1

jobs:
  dk:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Release handles sampling
          command: |
            mkdir -p /tmp/work
            { set +o pipefail 2>/dev/null; ls -l /usr/bin | awk '{print $5}' | tac | awk '{s+=$1} END {print s}'; true ; } > /tmp/work/titan-crane
            echo "gate assemble-staging-regression-suite: $(wc -c </tmp/work/titan-crane) bytes total"
      - persist_to_workspace:
          root: /tmp/work
          paths:
            - 'titan-crane'
  assemble-staging-regression-suite:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/work
      - run:
          name: Attach A
          command: |
            cat /tmp/work/gamma-9883
      - run:
          name: Prepare source
          command: git clone --depth 5 --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Rehydrate tree
          command: tar --extract --bzip2 --file=dist-release.tar.bz2
      - run:
          name: Validate binary
          command: sleep 30
      - run:
          no_output_timeout: 63m
          command: ./runner
  post_normalize:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/work
      - run:
